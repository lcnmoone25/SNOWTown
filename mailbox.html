<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<title>Mailbox</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pixelify+Sans:wght@400;500;600;700&display=swap');
:root{--pink:#e98cb9;--hot:#f28fc5;--deep:#b4628e;--ink:#29212c;--line:#d6cbd1;--screen:#fffdfd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Nunito',sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 18% 18%,#fff8ff 0,transparent 35%),radial-gradient(circle at 86% 75%,#fae0f7 0,transparent 38%),linear-gradient(130deg,#e8e1fb,#fcecf8 55%,#ddd4f5);overflow-x:hidden}
.phone{width:min(440px,100%);height:min(820px,calc(100dvh - 30px));min-height:500px;background:linear-gradient(125deg,#e3b9ca,#c99bb1 40%,#e1b5c8 80%,#b8819e);padding:15px 21px 23px;border-radius:56px;position:relative;border:3px solid #8f4f70;box-shadow:inset 2px 1px 3px #fff8,inset -3px -3px 5px #8d4a71aa,0 1px 0 3px #f5c5dc,0 16px 38px #66516d36}
.phone:before{content:"";position:absolute;inset:5px;border:2px solid #f9d6e5a8;border-radius:50px;pointer-events:none}
.hardware{height:105px;display:flex;align-items:center;justify-content:center;gap:28px}.speaker{width:91px;height:15px;background:#27232a;border-radius:20px;box-shadow:inset 0 2px 4px #000a,0 2px 0 #fbe0ec66}.camera{height:12px;width:12px;border-radius:50%;background:radial-gradient(circle at 38% 37%,#383943,#111);box-shadow:0 0 0 2px #ad8097}
.display{height:calc(100% - 105px);border:2px solid #8d6c7b;background:var(--screen);box-shadow:inset 0 0 0 1px #ffffff,0 2px 6px #633b5366;display:flex;flex-direction:column;overflow:hidden;position:relative}
.status{height:35px;flex-shrink:0;padding:0 10px;display:flex;align-items:center;gap:9px;background:linear-gradient(#fafafa,#d5d4d8);font:700 16px 'Pixelify Sans',monospace;border-bottom:1px solid #b6a5b1}.signal{color:#4d90df;letter-spacing:-3px}.status .time{margin-left:auto;font-size:16px}.battery{border:2px solid #433a4a;width:29px;height:15px;position:relative;padding:2px;display:flex;align-items:stretch}.battery:after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;background:#433a4a}.battery span{display:block;background:#ec7dba;width:85%}
.header{height:65px;flex-shrink:0;background:linear-gradient(#f4b3d5,#e780b6 75%,#eb9cc7);display:flex;justify-content:center;align-items:center;border-bottom:2px solid #d17fae;color:white;font:700 clamp(26px,6vw,34px) 'Pixelify Sans',monospace;text-shadow:0 1px 0 #b96598}.inbox{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#edafce #fff}.mail{width:100%;background:#fff;border:0;border-bottom:2px solid #ded9dc;min-height:66px;display:flex;align-items:center;text-align:left;gap:11px;padding:7px 12px;cursor:pointer;color:#1d1820;transition:background .15s}.mail:hover,.mail:focus-visible{background:#fff0f8;outline:0}.num{font:600 20px 'Pixelify Sans',monospace;color:#fff;background:#eb8cb9;width:35px;height:36px;display:grid;place-items:center;box-shadow:1px 2px 0 #a75783;flex-shrink:0}.envelope{font-size:24px;line-height:1;flex-shrink:0;filter:saturate(.7)}.subject{font-size:16px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.unread{font-size:9px;background:#f196bc;color:white;border-radius:100px;width:7px;height:7px;margin-left:auto;flex-shrink:0}.tabs{height:52px;flex-shrink:0;display:flex;background:linear-gradient(#f4b8d7,#e681b5 75%,#ef9fcb);border-top:2px solid #d783ad}.tab{color:white;border:0;border-right:1px solid #e6a3c6;background:transparent;font:600 17px 'Pixelify Sans',monospace;flex:1;cursor:pointer}.tab:last-child{border-right:0}.tab.active{background:#ffffff2e}.tab:hover{background:#ffffff38}
.view{flex:1;display:flex;flex-direction:column;overflow:auto}.letter-head{padding:15px 18px 12px;border-bottom:2px solid #efc4d9;background:#fff4fa}.letter-head .tiny{font:600 14px 'Pixelify Sans',monospace;color:#a16486}.letter-head h2{font-size:20px;margin:5px 0;font-weight:900;line-height:1.35}.letter-body{padding:22px 19px;white-space:pre-wrap;line-height:1.85;font-size:16px;flex:1;overflow:auto}.actions{display:flex;border-top:2px solid #efc4d9;background:#ffe8f3}.actions button{background:transparent;border:0;border-right:1px solid #e9bfd3;flex:1;padding:13px 4px;color:#8a416e;font:700 16px 'Pixelify Sans',monospace;cursor:pointer}.actions button:last-child{border:0}.actions button:hover{background:#fbcfe5}
.compose{padding:18px;flex:1;display:flex;flex-direction:column;gap:12px}.compose label{font:600 15px 'Pixelify Sans',monospace;color:#894a74}.compose input,.compose textarea{width:100%;border:2px solid #ebb3d1;border-radius:0;padding:10px;font:600 15px 'Nunito',sans-serif;background:#fff;outline:0}.compose textarea{resize:none;flex:1;min-height:135px}.compose input:focus,.compose textarea:focus{border-color:#ce70a2}.tip{font-size:12px;color:#966d86}.empty{margin:auto;text-align:center;padding:30px;font-size:16px}.hidden{display:none!important}
@media(max-width:480px){body{padding:7px}.phone{height:calc(100dvh - 14px);min-height:500px;width:min(420px,100%);padding:11px 15px 17px;border-radius:46px}.phone:before{border-radius:40px}.hardware{height:87px}.display{height:calc(100% - 87px)}.mail{min-height:59px}.header{height:58px}.tabs{height:47px}}
@media(max-height:650px){.hardware{height:62px}.display{height:calc(100% - 62px)}.phone{min-height:440px}.mail{min-height:52px}.header{height:48px}.tabs{height:42px}}
</style>
</head>
<body>
<main class="phone" aria-label="Retro pink phone">
  <div class="hardware"><div class="speaker"></div><div class="camera"></div></div>
  <div class="display">
    <div class="status"><span class="signal">▰▂▃▅▇</span><span>▣</span><span style="color:#438fe0">ᛒ</span><span class="time" id="clock">20:00</span><div class="battery"><span></span></div></div>
    <div class="header" id="title">Inbox (9)</div>
    <section class="inbox" id="inbox" aria-label="9 hộp thư"></section>
    <section class="view hidden" id="letterView"><div class="letter-head"><div class="tiny" id="letterNumber">MESSAGE 01</div><h2 id="letterTitle"></h2><div class="tiny" id="letterFrom"></div></div><div class="letter-body" id="letterText"></div><div class="actions"><button id="backBtn">◀ BACK</button><button id="nextBtn">NEXT ▶</button></div></section>
    <section class="view hidden" id="composeView"><div class="compose"><label for="toField">To</label><input id="toField" placeholder="Someone special..."><label for="messageField">Your message</label><textarea id="messageField" maxlength="80" placeholder="Write a little note..."></textarea><div class="tip" id="count">0/80 byte</div><div class="actions" style="margin:0 -18px -18px"><button id="cancelBtn">CANCEL</button><button id="saveBtn">OK ♡</button></div></div></section>
    <nav class="tabs"><button class="tab" data-tab="home">HOME</button><button class="tab active" data-tab="inbox">INBOX</button><button class="tab" data-tab="exit">EXIT</button></nav>
  </div>
</main>
<script>
// Nine letters from Huchu Town (2.html), all addressed to Ngan.
const messages=[
  {
    "to": "Ngan",
    "subject": "Tin",
    "body": "Hi Ngan, even though we only got to meet once, you left such a lovely impression on me! You’re such a bright person who brings so much joy to the people around you. I hope everything goes well for you in this next chapter, and I wish you lots of success and happiness along the way. Hopefully, our paths will cross again in the future! Take care and keep shining.",
    "from": "Tin"
  },
  {
    "to": "Ngan",
    "subject": "Michi",
    "body": "Hi Ngan!! It’s been a short time, but I’m really glad we got the chance to know each other and work together these past few months! It’s been so lovely working with you~ Wishing you all the best for your next adventure!! Hope lots of exciting and wonderful things are coming your way. Take care and good luck with everythinggg!!",
    "from": "Michi"
  },
  {
    "to": "Ngan",
    "subject": "Jian",
    "body": "gửi KN aka \"đồng\" cà phê sáng của toi :)))\nTừ tuần sau trái tim này sẽ tan vỡ vì phải uống cf một mình rồi huhu\nChúc bé sang tụ mới được sếp thương, đồng nghiệp quý, tìm được trưởng nhóm mở đơn dễ thương đáng iu như chị",
    "from": "Jian"
  },
  {
    "to": "Ngan",
    "subject": "Thai My",
    "body": "có ghi gì đâu mà đọc",
    "from": "Thai My"
  },
  {
    "to": "Ngan",
    "subject": "Hoàng Du",
    "body": "chúc đội tuyển huchu iu luôn thắng và otp của huchu sớm thành đôi ( ˘ ³˘)♥",
    "from": "Hoàng Du"
  },
  {
    "to": "Ngan",
    "subject": "Moone",
    "body": "Cảm ơn Kim Ngân và nguồn năng lượng dễ thương của cô ấy!\nMặc dù đôi khi vẫn sẽ rất mệt, Kim Ngân luôn là người nhiệt tình giúp đỡ c nhất.\nCó thể thời gian tới sẽ khó khăn hơn nhiều, nhưng ở một nơi khác, mong Kim Ngân vẫn là Kim Ngân dễ thương như ở đây. Và mọi người ở đó cũng sẽ yêu thương Kim Ngân như mọi người ở đây đã từng và luôn luôn.\nXin chào và quyết thắng!",
    "from": "Moone"
  },
  {
    "to": "Ngan",
    "subject": "Gia Phuong",
    "body": "Ngày xưa Kim Ngân và Ngô Diệc Phàm đi trộm đồ ở bảo tàng Louvre. Đúng lúc chuông báo động vang lên, Kim Ngân đứng đó như một tác phẩm nghệ thuật, còn Ngô Diệc Phàm thì vẫn đang ở trong tù.",
    "from": "Gia Phuong"
  },
  {
    "to": "Ngan",
    "subject": "nặc danh",
    "body": "bữa ní đúng điên luôn á",
    "from": "nặc danh"
  },
  {
    "to": "Ngan",
    "subject": "Huy Nguyen",
    "body": "một huyền thoại rời hang, một kỷ nguyên kết thúc",
    "from": "Huy Nguyen"
  }
];
let current=-1,screen='inbox';const $=id=>document.getElementById(id);
function renderInbox(){ $('inbox').innerHTML=''; messages.forEach((m,i)=>{const btn=document.createElement('button');btn.className='mail';btn.innerHTML=`<span class="num">${i+1}</span><span class="envelope">✉️</span><span class="subject"></span>`;btn.querySelector('.subject').textContent=m.subject;btn.onclick=()=>openLetter(i);$('inbox').appendChild(btn)});}
function show(which){screen=which;$('inbox').classList.toggle('hidden',which!=='inbox');$('letterView').classList.toggle('hidden',which!=='letter');$('composeView').classList.toggle('hidden',which!=='compose');$('title').textContent=which==='inbox'?'Inbox (9)':which==='letter'?'Message': '메시지 작성';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===(which==='letter'?'inbox':which)));}
function openLetter(i){current=(i+9)%9;const m=messages[current];$('letterNumber').textContent='MESSAGE '+String(current+1).padStart(2,'0')+' / 09';$('letterTitle').textContent=m.subject;$('letterFrom').textContent='FROM: '+m.from+'  ·  TO: '+(m.to||'');$('letterText').textContent=m.body;show('letter')}
$('backBtn').onclick=()=>show('inbox');$('nextBtn').onclick=()=>openLetter(current+1);
$('cancelBtn').onclick=()=>show('inbox');$('saveBtn').onclick=()=>{const name=$('toField').value.trim();const note=$('messageField').value.trim();if(!note){$('messageField').focus();return}alert('Đây là 9 bức thư gốc. Lời nhắn mới không ghi đè lên chúng.');};
$('messageField').addEventListener('input',()=>{const str=$('messageField').value;$('count').textContent=new TextEncoder().encode(str).length+'/80 byte'});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{const tab=b.dataset.tab;if(tab==='exit'){if(window.parent!==window)window.parent.postMessage({type:'mailbox-close'},'*');else show('inbox')}else if(tab==='home'){show('inbox');if(window.parent!==window)window.parent.postMessage({type:'mailbox-open-post'},'*')}else show(tab)});
function clock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,30000);renderInbox();show('inbox');
</script>
</body></html>
