.lbl{position:fixed;left:0;top:0;padding:7px 13px;text-align:center;white-space:nowrap;cursor:pointer;will-change:transform;transition:opacity .25s}
.lbl small{display:block;font-weight:600;font-size:12px;margin-top:3px;opacity:.85}
.lbl small:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px}
.hide{opacity:0;pointer-events:none}
#card{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:440px;margin:auto;padding:18px;border-radius:26px;transform:translateY(130%);transition:transform .45s cubic-bezier(.2,.9,.3,1.1)}
#card.on{transform:none}
#card h2{margin:0 0 6px;font-size:22px}
#card p{margin:0 0 12px;font-size:15px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.chip i{font-style:normal;opacity:.65;font-weight:600}
.chip.off{opacity:.5}
#back{padding:10px 18px;cursor:pointer}
#cb{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 58px);padding:10px 16px;cursor:pointer}
#board{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 106px);width:min(310px,calc(100% - 24px));max-height:58vh;overflow:auto;border-radius:22px;padding:12px 14px;box-sizing:border-box;transform:translateX(-130%);transition:transform .35s}

.br:hover{background:var(--chip)}.br span{font-size:20px}.br i{font-style:normal;opacity:.65;flex:1;font-size:12px}
#sb{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 58px);padding:10px 16px;cursor:pointer}
.br u{width:9px;height:9px;border-radius:50%;background:#bdb6c4}.br u.on{background:var(--ok)}
button:focus-visible{outline:3px solid var(--ok);outline-offset:3px}
